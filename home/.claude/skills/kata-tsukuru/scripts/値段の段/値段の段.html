<!-- 値段の段（ここちドライ型）ひな形。値段の段を組む.py が {{…}} を埋める。手で埋めない（いちばん大きいセットの「一番人気」と選ばれた状態は道具が付ける） -->
<section class="nd" data-tasu="2" data-nedan="ここちドライ型"{{段の印}} style="{{色}}">
<style>{{CSS}}</style>
{{お知らせ帯}}
<h2>{{見出し}}</h2>
{{前振り}}
<p>{{比べる前の一文}}</p>
<ul class="nd-cost" data-kuraberu>
{{比べる物}}
</ul>
{{三年}}
{{一つの比べ}}
<div class="nd-box">
  <span class="nd-tag">{{札}}</span>
  <div class="nd-p">{{箱のセット名}} <s>{{通常の値段}}</s> → <span class="nd-nw"><b>{{今の値段}}</b>（税込）</span></div>
  <small>{{箱の注}}</small>
</div>
<p>{{1日あたりの文}}</p>
<figure class="nd-fig"><img loading="lazy" decoding="async" src="{{値段画像}}" alt="{{値段画像の説明}}" width="816" height="1200"></figure>
{{画像の後}}
{{小さいセット}}
<div class="nd-sets" style="--nd-n:{{セットの数}}">
{{セット}}
</div>
{{セットの後}}
{{一押し}}
<a class="nd-cta" data-cta href="{{行き先}}">{{ボタンの文}}</a>
<p class="nd-note">{{ボタンの下}}</p>
{{注の前提}}
{{固定帯}}
<script>{{JS}}</script>
</section>
